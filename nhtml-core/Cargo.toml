[package]
name = "nhtml-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "nhtml_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "nhtml"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nom = "7.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
