<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nhtml - Navigateur WASM V2</title>
    <style>
        body { font-family: 'Inter', system-ui; background: #0f172a; color: #f1f5f9; padding: 2rem; }
        .card { background: #1e293b; padding: 1.5rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
        textarea { width: 100%; height: 250px; background: #020617; color: #38bdf8; border: 1px solid #334155; padding: 1rem; border-radius: 4px; font-family: monospace; }
        #root { border: 2px dashed #475569; padding: 1rem; min-height: 250px; border-radius: 4px; }
        button { background: #3b82f6; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>

    <div class="card" style="margin-bottom: 2rem;">
        <h1>⚛️ Nhtml WebAssembly Playground</h1>
        <p>Le code source à gauche est compilé en direct par le moteur Rust (WASM) 🚀.</p>
    </div>

    <div class="grid">
        <div class="card">
            <h3>Source Nhtml</h3>
            <textarea id="editor">
<var counter=0>
<var user='{"name": "Admin", "role": "super"}'>

<div class="demo">
    <h2>Bonjour {user.name} ({user.role})</h2>
    
    <label>Changer le nom :
        <input type="text" bind:value="{user.name}">
    </label>

    <div style="margin-top: 1rem;">
        <button on:click="counter++">Incrémenter</button>
        <button on:click="counter--">Décrémenter</button>
        <button on:click="counter = 0">Reset</button>
    </div>

    <h3>Compteur Actuel : {counter}</h3>

    <if condition="counter > 5">
        <p style="color: #ef4444; font-weight: bold;">🔥 Mode Turbo Activé !</p>
    </if>
</div>
            </textarea>
            <button id="btn-compile" style="margin-top: 1rem;">Compiler & Mount</button>
        </div>

        <div class="card">
            <h3>Rendu DOM Interactif (JS Bridge)</h3>
            <div id="root"></div>
        </div>
    </div>

    <!-- On simule le chargement du module wasm, une fois wasm-pack prêt. -->
    <script type="module">
        // IMPORT DU WASM BINDINGS (Sera actif une fois wasm-pack executé par l'utilisateur)
        import init, { compile_wasm } from './nhtml-core/pkg/nhtml_core.js';

        // ── MICRO-RUNTIME JS DE HYDRO/BRIDGE ───────────────────────────────
        function hydrateDOM(html, manifest) {
            const root = document.getElementById('root');
            root.innerHTML = html; // Injection initiale (Virtuel/Static)

            window._nhtmlState = {};
            window._nhtmlAST = manifest;

            // 1. Initialisation State Variables
            for (const [key, config] of Object.entries(manifest.state_vars || {})) {
                window._nhtmlState[key] = config.initial_value;
            }

            // 2. Evaluateur
            window._nhtmlEval = function(expr, localContext = {}) {
                try {
                    const scope = { ...window._nhtmlState, ...localContext };
                    const fn = new Function(...Object.keys(scope), `return ${expr}`);
                    return fn(...Object.values(scope));
                } catch(e) { return ""; }
            };

            // 3. Diffing Actif (Hydrate)
            window._nhtmlHydrate = function() {
                for (const [id, node] of Object.entries(manifest.nodes || {})) {
                    const el = document.getElementById(id);
                    if (!el) continue;

                    if (node.type === "text") el.textContent = window._nhtmlEval(node.expr);
                    else if (node.type === "html") el.innerHTML = window._nhtmlEval(node.expr);
                    else if (node.type === "if") el.style.display = window._nhtmlEval(node.condition) ? '' : 'none';
                    else if (node.type === "attrs" && node.bindings) {
                        for (const [attr, val] of Object.entries(node.bindings)) {
                            let fVal = val.replace(/\{(.*?)\}/g, (_, e) => window._nhtmlEval(e));
                            if (attr === 'value') el.value = fVal;
                            else el.setAttribute(attr, fVal);
                        }
                    }
                }
            };

            // 4. Proxy Réactif
            window.nhtml = new Proxy(window._nhtmlState, {
                set(t, p, v) { t[p] = v; window._nhtmlHydrate(); return true; },
                get(t, p) { return t[p]; }
            });

            // 5. Attachement des Event Listeners !
            for (const [id, node] of Object.entries(manifest.nodes || {})) {
                const el = document.getElementById(id);
                if (!el || !node.events) continue;
                for (const [eventName, ops] of Object.entries(node.events)) {
                    el.addEventListener(eventName, (e) => {
                        for (const op of ops) {
                            if (op.op === 'increment') window.nhtml[op.target] += Number(op.value);
                            else if (op.op === 'set') {
                                let v = op.value;
                                if (v === "this.value") v = e.target.value;
                                else if (typeof v === "string" && isNaN(v)) v = window._nhtmlEval(v);
                                
                                // Binding profond (user.name)
                                if (op.target.includes('.')) {
                                    const parts = op.target.split('.');
                                    let current = window.nhtml;
                                    for (let i = 0; i < parts.length - 1; i++) current = current[parts[i]];
                                    current[parts[parts.length - 1]] = v;
                                } else window.nhtml[op.target] = v;
                            }
                            else if (op.op === 'eval') window._nhtmlEval(op.expr, { $event: e });
                        }
                    });
                }
            }

            // Premier rendu
            window._nhtmlHydrate();
        }
        
        async function run() {
            await init(); 
            document.getElementById('btn-compile').addEventListener('click', () => {
                const source = document.getElementById('editor').value;
                const result_json = compile_wasm(source);
                const result = JSON.parse(result_json);
                hydrateDOM(result.html, result.manifest);
            });
            console.log("WASM prêt. Cliquez sur Compiler & Mount.");
            // On compile automatiquement la première fois pour le confort visuel
            document.getElementById('btn-compile').click();
        }
        run();

    </script>
</body>
</html>
