[ports]
# Port pour les WebSockets NHTML (défaut: 8080)
ws = 8080

# Port pour le serveur web HTTP (injection auto) (défaut: 3000)
http = 3000

# Port pour le serveur PHP en arrière-plan (défaut: 8000)
php = 8000

# Port pour le Dashboard DevTools (défaut: 8082)
devtools = 8082

[dev]
# Activer le live-reload par défaut sans taper --dev (défaut: false)
auto_reload = false

[fastcgi]
# Adresse du serveur PHP-FPM (ex: "127.0.0.1:9000" ou "unix:/var/run/php/php-fpm.sock")
address = ""
# Timeout pour les appels FastCGI en millisecondes (défaut: 5000)
timeout_ms = 5000

# [security]
# Limite de taux (événements par seconde par IP)
# rate_limit = { events_per_sec = 20 }
# Configuration TLS native
# tls = { enabled = true, cert = "cert.pem", key = "key.pem", min_version = "1.3" }

# [cluster]
# enabled = false
# URL Redis pour le broadcasting multi-gateway. DOIT inclure une authentification en production.
# redis_url = "redis://user:password@127.0.0.1:6379"
