name: Release NHTML Gateway

on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: nhtml-linux
            asset_name: nhtml-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: nhtml-windows.exe
            asset_name: nhtml.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: nhtml-macos
            asset_name: nhtml-macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Note: On reste en v4 car c'est la branche LTS stable recommandée en 2026 pour la plupart des environnements

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Windows)
        if: matrix.os == 'windows-latest'
        run: mv target/${{ matrix.target }}/release/nhtml.exe ${{ matrix.artifact_name }}

      - name: Rename binary (Unix)
        if: matrix.os != 'windows-latest'
        run: mv target/${{ matrix.target }}/release/nhtml ${{ matrix.artifact_name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract Changelog
        shell: bash
        run: |
          # Extraire la version sans le 'v' initial
          VERSION=${GITHUB_REF_NAME#v}
          # Rechercher la section correspondante jusqu'à la prochaine section ##
          sed -n "/## v$VERSION/,/## v/p" CHANGELOG.md | sed '1d;$d' > RELEASE_NOTES.md

      - name: Create Distribution Packages (ZIP)
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME}
          # Package Shared Mode
          zip -r "nhtml-shared-${VERSION}.zip" assets/ sdk/ router.php nhtml.config.toml README.md LICENSE -x "assets/logo.png"
          # Package WASM Mode
          zip -r "nhtml-wasm-${VERSION}.zip" assets/js/bridge.js assets/js/php-wasm/ assets/js/fzstd.min.js README.md
          
          # Move to artifacts dir for release
          mkdir -p dist_pkgs
          mv "nhtml-shared-${VERSION}.zip" dist_pkgs/
          mv "nhtml-wasm-${VERSION}.zip" dist_pkgs/

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.0.8
        with:
          name: NHTML Gateway ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/nhtml-linux
            artifacts/nhtml-windows.exe
            artifacts/nhtml-macos
            dist_pkgs/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
