name: Release NHTML Gateway

on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: nhtml-linux
            asset_name: nhtml-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: nhtml-windows.exe
            asset_name: nhtml.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: nhtml-macos
            asset_name: nhtml-macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Note: On reste en v4 car c'est la branche LTS stable recommandée en 2026 pour la plupart des environnements

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Windows)
        if: matrix.os == 'windows-latest'
        run: mv target/${{ matrix.target }}/release/nhtml-gateway.exe ${{ matrix.artifact_name }}

      - name: Rename binary (Unix)
        if: matrix.os != 'windows-latest'
        run: mv target/${{ matrix.target }}/release/nhtml-gateway ${{ matrix.artifact_name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract Changelog
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -n "/## v$VERSION/,/##/p" CHANGELOG.md | sed '1d;$d' > RELEASE_NOTES.md

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          name: NHTML Gateway v${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/nhtml-linux
            artifacts/nhtml-windows.exe
            artifacts/nhtml-macos
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
